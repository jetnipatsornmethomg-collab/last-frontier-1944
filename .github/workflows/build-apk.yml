
name: Build LAST FRONTIER 1944 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false
          packages: 'platform-tools;platforms;android-35;build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Check project ZIP
        run: |
          test -f LAST_FRONTIER_1944_Android_GitHub_Build.zip

      - name: Extract Android project
        run: |
          unzip -q LAST_FRONTIER_1944_Android_GitHub_Build.zip -d source

      - name: Check extracted project
        run: |
          find source -name build.gradle -o -name settings.gradle
          test -f source/LAST_FRONTIER_1944_Android/app/build.gradle

      - name: Build debug APK
        run: |
          cd source/LAST_FRONTIER_1944_Android
          gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LAST-FRONTIER-1944-BETA-APK
          path: source/LAST_FRONTIER_1944_Android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
