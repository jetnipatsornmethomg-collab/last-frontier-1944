
name: Build LAST FRONTIER 1944 APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project
        run: |
          unzip -q LAST_FRONTIER_1944_Android_GitHub_Build.zip -d source

      - name: Build APK
        run: |
          cd source/LAST_FRONTIER_1944_Android
          gradle --no-daemon assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: LAST-FRONTIER-1944-BETA-APK
          path: source/LAST_FRONTIER_1944_Android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
